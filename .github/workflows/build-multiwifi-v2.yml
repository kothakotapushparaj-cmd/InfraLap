      - name: Add secure one-click VPS pairing import to the desktop app
        shell: pwsh
        run: |
          $root = $env:V2_PROJECT_ROOT
          $app = Join-Path $root 'Client/src/InfraLap.MultiWiFi.App'
          $bondingPath = Join-Path $app 'BondingWindow.xaml.cs'
          $bonding = [IO.File]::ReadAllText($bondingPath)

          $csprojPath = Join-Path $app 'InfraLap.MultiWiFi.App.csproj'
          $csproj = [IO.File]::ReadAllText($csprojPath)
          if (-not $csproj.Contains('System.Security.Cryptography.ProtectedData')) {
            $csproj = $csproj.Replace('</Project>', '  <ItemGroup>' + [Environment]::NewLine +
              '    <PackageReference Include="System.Security.Cryptography.ProtectedData" Version="10.0.0" />' + [Environment]::NewLine +
              '  </ItemGroup>' + [Environment]::NewLine + '</Project>')
            [IO.File]::WriteAllText($csprojPath, $csproj, [Text.UTF8Encoding]::new($false))
          }

          if (-not $bonding.Contains('LoadSavedRelayPairing();')) {
            $bonding = $bonding.Replace('        AddWifiManagerLauncher();',
              '        AddWifiManagerLauncher();' + [Environment]::NewLine + '        LoadSavedRelayPairing();')
          }

          if (-not $bonding.Contains('Content = "Import VPS Pairing File"')) {
            $toolbarMarker = '              var hint = new System.Windows.Controls.TextBlock'
            if (-not $bonding.Contains($toolbarMarker)) { throw 'Wi-Fi toolbar insertion point was not found.' }
            $pairingButton = @'
              var pairingButton = new System.Windows.Controls.Button
              {
                  Content = "Import VPS Pairing File",
                  Padding = new Thickness(14, 8, 14, 8),
                  Margin = new Thickness(0, 0, 8, 0),
                  FontWeight = FontWeights.SemiBold,
                  Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(22, 132, 92)),
                  Foreground = System.Windows.Media.Brushes.White,
                  BorderThickness = new Thickness(0),
                  Cursor = System.Windows.Input.Cursors.Hand
              };
              pairingButton.Click += (_, _) => ImportRelayPairingFile();
              System.Windows.Controls.DockPanel.SetDock(pairingButton, System.Windows.Controls.Dock.Right);
              bar.Children.Add(pairingButton);
'@
            $bonding = $bonding.Replace($toolbarMarker, $pairingButton + [Environment]::NewLine + $toolbarMarker)
          }

          if (-not $bonding.Contains('private void ImportRelayPairingFile()')) {
            $methods = @'
          private static string RelayPairingStorePath =>
              System.IO.Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                  "InfraLap", "MultiWiFi", "relay-pairing.protected");

          private void LoadSavedRelayPairing()
          {
              try
              {
                  var path = RelayPairingStorePath;
                  if (!System.IO.File.Exists(path)) return;
                  var protectedBytes = System.IO.File.ReadAllBytes(path);
                  var clearBytes = System.Security.Cryptography.ProtectedData.Unprotect(
                      protectedBytes, null, System.Security.Cryptography.DataProtectionScope.CurrentUser);
                  ApplyRelayPairingJson(System.Text.Encoding.UTF8.GetString(clearBytes));
                  BondingStatus.Text = "Saved VPS pairing loaded securely for this Windows user.";
              }
              catch (Exception ex)
              {
                  BondingStatus.Text = "Saved VPS pairing could not be loaded: " + ex.Message;
              }
          }

          private void ImportRelayPairingFile()
          {
              var dialog = new Microsoft.Win32.OpenFileDialog
              {
                  Title = "Select the InfraLap VPS pairing file",
                  Filter = "InfraLap VPS pairing file (*.json)|*.json|All files (*.*)|*.*",
                  CheckFileExists = true,
                  Multiselect = false
              };
              if (dialog.ShowDialog(this) != true) return;
              try
              {
                  var json = System.IO.File.ReadAllText(dialog.FileName);
                  ApplyRelayPairingJson(json);
                  var clearBytes = System.Text.Encoding.UTF8.GetBytes(json);
                  var protectedBytes = System.Security.Cryptography.ProtectedData.Protect(
                      clearBytes, null, System.Security.Cryptography.DataProtectionScope.CurrentUser);
                  var storePath = RelayPairingStorePath;
                  System.IO.Directory.CreateDirectory(System.IO.Path.GetDirectoryName(storePath)!);
                  System.IO.File.WriteAllBytes(storePath, protectedBytes);
                  BondingStatus.Text = "VPS pairing imported and saved securely. You will not need to type the pin or token again.";
                  MessageBox.Show(this, "VPS pairing imported successfully. Server address, certificate pin and pairing token are now saved for this Windows user.",
                      "InfraLap MultiWiFi", MessageBoxButton.OK, MessageBoxImage.Information);
              }
              catch (Exception ex)
              {
                  MessageBox.Show(this, "Pairing file could not be imported: " + ex.Message,
                      "InfraLap pairing error", MessageBoxButton.OK, MessageBoxImage.Warning);
              }
          }

          private void ApplyRelayPairingJson(string json)
          {
              using var document = System.Text.Json.JsonDocument.Parse(json);
              var root = document.RootElement;
              var host = root.GetProperty("serverHost").GetString()?.Trim();
              var port = root.GetProperty("udpPort").GetInt32();
              var pin = root.GetProperty("certificateSha256").GetString()?.Trim();
              var token = root.GetProperty("pairingToken").GetString()?.Trim();
              if (string.IsNullOrWhiteSpace(host)) throw new InvalidOperationException("Pairing file does not contain a server host.");
              if (port is < 1 or > 65535) throw new InvalidOperationException("Pairing file contains an invalid UDP port.");
              if (string.IsNullOrWhiteSpace(pin) || pin.Replace(":", "").Length != 64 ||
                  pin.Replace(":", "").Any(ch => !Uri.IsHexDigit(ch)))
                  throw new InvalidOperationException("Pairing file contains an invalid SHA-256 certificate pin.");
              if (string.IsNullOrWhiteSpace(token) || token.Length < 32)
                  throw new InvalidOperationException("Pairing file contains an invalid pairing token.");
              RelayHostBox.Text = host;
              RelayPortBox.Text = port.ToString(System.Globalization.CultureInfo.InvariantCulture);
              CertificatePinBox.Text = pin;
              TokenBox.Password = token;
          }

'@
            $insertAt = '    private void RefreshPaths_Click(object sender, RoutedEventArgs e) => RefreshPaths();'
            if (-not $bonding.Contains($insertAt)) { throw 'Pairing methods insertion point was not found.' }
            $bonding = $bonding.Replace($insertAt, $methods + $insertAt)
          }

          [IO.File]::WriteAllText($bondingPath, $bonding, [Text.UTF8Encoding]::new($false))
          Write-Host 'Added Import VPS Pairing File button and DPAPI-protected per-user settings.'
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download and verify official Wintun x64 package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ($actual -ne $expected) { throw "Wintun archive SHA-256 mismatch. Expected $expected, got $actual" }
          $root = Join-Path $env:RUNNER_TEMP 'wintun-package'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $dll = Get-ChildItem -Path $root -Filter 'wintun.dll' -File -Recurse | Where-Object { $_.FullName -match '\\(amd64|x64)\\wintun\.dll$' } | Select-Object -First 1
          if (!$dll) { throw 'Official Wintun archive did not contain an AMD64 wintun.dll.' }
          $license = Get-ChildItem -Path $root -File -Recurse | Where-Object { $_.Name -match '^(COPYING|LICENSE)(\.txt)?$' } | Select-Object -First 1
          if (!$license) { throw 'Wintun license file not found in official archive.' }
          "WINTUN_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINTUN_LICENSE=$($license.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore solution
        shell: pwsh
        run: dotnet restore (Join-Path $env:V2_PROJECT_ROOT 'InfraLap.MultiWiFi-v2.sln')

      - name: Build solution
        shell: pwsh
        run: dotnet build (Join-Path $env:V2_PROJECT_ROOT 'InfraLap.MultiWiFi-v2.sln') -c $env:CONFIGURATION --no-restore -p:Platform=x64

      - name: Run bonding logic smoke tests
        shell: pwsh
        run: dotnet run --project (Join-Path $env:V2_PROJECT_ROOT 'tests/InfraLap.MultiWiFi.Bonding.Smoke/InfraLap.MultiWiFi.Bonding.Smoke.csproj') -c $env:CONFIGURATION

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @("${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe", "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler was not found.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Windows x64 client and relay
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          $publishRoot = Join-Path $projectRoot 'publish'
          $appOut = Join-Path $publishRoot 'app'
          $relayOut = Join-Path $publishRoot 'relay'
          New-Item -ItemType Directory -Force -Path $appOut,$relayOut | Out-Null
          dotnet publish (Join-Path $projectRoot 'Client/src/InfraLap.MultiWiFi.App/InfraLap.MultiWiFi.App.csproj') -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Platform=x64 -o $appOut
          if ($LASTEXITCODE -ne 0) { throw "Client publish failed: $LASTEXITCODE" }
          dotnet publish (Join-Path $projectRoot 'Relay/InfraLap.MultiWiFi.Relay.csproj') -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Platform=x64 -o $relayOut
          if ($LASTEXITCODE -ne 0) { throw "Relay publish failed: $LASTEXITCODE" }
          Copy-Item $env:WINTUN_DLL -Destination (Join-Path $appOut 'wintun.dll') -Force
          Copy-Item $env:WINTUN_DLL -Destination (Join-Path $relayOut 'wintun.dll') -Force
          Copy-Item $env:WINTUN_LICENSE -Destination (Join-Path $appOut 'WINTUN-LICENSE.txt') -Force
          Copy-Item $env:WINTUN_LICENSE -Destination (Join-Path $relayOut 'WINTUN-LICENSE.txt') -Force
          $required = @((Join-Path $appOut 'InfraLap.MultiWiFi.exe'),(Join-Path $relayOut 'InfraLap.MultiWiFi.Relay.exe'),(Join-Path $appOut 'wintun.dll'),(Join-Path $relayOut 'wintun.dll'))
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Required package file missing: $file" } }

      - name: Add one-click Windows VPS relay installer
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          $relayRoot = Join-Path $projectRoot 'publish/relay'
          if (!(Test-Path (Join-Path $relayRoot 'InfraLap.MultiWiFi.Relay.exe'))) { throw 'Published relay executable is missing.' }

          $setup = @'
          [CmdletBinding()]
          param()
          $ErrorActionPreference = 'Stop'

          $identityDir = Join-Path $env:ProgramData 'InfraLap\Relay'
          $taskName = 'InfraLap MultiWiFi Relay'
          $relayRoot = $PSScriptRoot
          $relayExe = Join-Path $relayRoot 'InfraLap.MultiWiFi.Relay.exe'
          $wintunDll = Join-Path $relayRoot 'wintun.dll'
          $configureScript = Join-Path $relayRoot 'scripts\Configure-InfraLapRelay-Network.ps1'
          $networkState = Join-Path $identityDir 'network-state.json'

          $isAdmin = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) { throw 'Run START-INFraLap-Relay-Setup.cmd and approve the Administrator prompt.' }
          if (!(Test-Path $relayExe) -or !(Test-Path $wintunDll) -or !(Test-Path $configureScript)) {
              throw 'Relay package is incomplete. Extract the complete InfraLap relay ZIP before running setup.'
          }

          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -eq 1 -or [version]$os.Version -lt [version]'10.0.20348') {
              throw 'This relay setup requires Windows Server 2022 or later.'
          }

          Write-Host 'InfraLap MultiWiFi — One-click VPS setup' -ForegroundColor Cyan
          Write-Host 'Detecting the VPS internet interface and public IPv4 address...'
          $defaultRoute = Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop |
              Where-Object { $_.NextHop -and $_.NextHop -ne '0.0.0.0' } |
              Sort-Object RouteMetric |
              Select-Object -First 1
          if (-not $defaultRoute) { throw 'No active IPv4 default route was found on this VPS.' }
          $external = Get-NetAdapter -InterfaceIndex $defaultRoute.InterfaceIndex -ErrorAction Stop
          if ($external.Status -ne 'Up') { throw "The VPS internet adapter '$($external.Name)' is not Up." }

          $publicHost = $null
          try {
              $publicHost = ([string](Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 15)).Trim()
              $parsedHost = [System.Net.IPAddress]::Parse($publicHost)
              if ($parsedHost.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) { $publicHost = $null }
          } catch { $publicHost = $null }
          if ([string]::IsNullOrWhiteSpace($publicHost)) {
              throw 'The VPS public IPv4 address could not be detected automatically. Confirm outbound internet access and try again.'
          }

          New-Item -ItemType Directory -Force -Path $identityDir | Out-Null
          $pfxPath = Join-Path $identityDir 'InfraLap-Relay.pfx'
          $passwordPath = Join-Path $identityDir 'pfx-password.txt'
          $tokenPath = Join-Path $identityDir 'pairing-token.txt'
          $pairingPath = Join-Path $identityDir 'InfraLap-Client-Pairing.json'

          if (!(Test-Path $pfxPath) -or !(Test-Path $passwordPath)) {
              Write-Host 'Creating the relay certificate and private key...'
              $randomPassword = New-Object byte[] 32
              $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
              try { $rng.GetBytes($randomPassword) } finally { $rng.Dispose() }
              $pfxPassword = [Convert]::ToBase64String($randomPassword).TrimEnd('=')
              [Array]::Clear($randomPassword, 0, $randomPassword.Length)
              $securePassword = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
              $certificate = New-SelfSignedCertificate -Subject "CN=$publicHost" -DnsName $publicHost -CertStoreLocation 'Cert:\LocalMachine\My' -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(2)
              Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword -Force | Out-Null
              [IO.File]::WriteAllText($passwordPath, $pfxPassword, [Text.Encoding]::UTF8)
          }
          if (!(Test-Path $tokenPath) -or [string]::IsNullOrWhiteSpace((Get-Content -Raw $tokenPath))) {
              $randomToken = New-Object byte[] 32
              $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
              try { $rng.GetBytes($randomToken) } finally { $rng.Dispose() }
              $pairingToken = [Convert]::ToBase64String($randomToken)
              [Array]::Clear($randomToken, 0, $randomToken.Length)
              [IO.File]::WriteAllText($tokenPath, $pairingToken, [Text.Encoding]::UTF8)
          } else {
              $pairingToken = (Get-Content -Raw $tokenPath).Trim()
          }

          $pfxPassword = (Get-Content -Raw $passwordPath).Trim()
          $loadedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $pfxPassword, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          try {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $certificatePin = [BitConverter]::ToString($sha.ComputeHash($loadedCertificate.RawData)).Replace('-', '') }
              finally { $sha.Dispose() }
          } finally { $loadedCertificate.Dispose() }

          $pairing = [ordered]@{
              serverHost = $publicHost
              udpPort = 4433
              certificateSha256 = $certificatePin
              pairingToken = $pairingToken
          }
          $pairing | ConvertTo-Json -Depth 4 | Set-Content -Path $pairingPath -Encoding UTF8
          & icacls.exe $identityDir /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not restrict access to the relay identity folder.' }

          $tunnel = Get-NetAdapter -Name 'InfraLap Relay' -ErrorAction SilentlyContinue
          if (-not $tunnel) {
              Write-Host 'Creating the InfraLap Wintun relay adapter...'
              $arguments = '--port 4433 --pfx "' + $pfxPath + '" --pfx-password-file "' + $passwordPath + '" --token-file "' + $tokenPath + '"'
              $stdout = Join-Path $identityDir 'adapter-bootstrap.stdout.log'
              $stderr = Join-Path $identityDir 'adapter-bootstrap.stderr.log'
              $bootstrap = Start-Process -FilePath $relayExe -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              try {
                  for ($attempt = 0; $attempt -lt 30; $attempt++) {
                      Start-Sleep -Seconds 1
                      $tunnel = Get-NetAdapter -Name 'InfraLap Relay' -ErrorAction SilentlyContinue
                      if ($tunnel) { break }
                      if ($bootstrap.HasExited) { break }
                  }
              } finally {
                  if ($bootstrap -and -not $bootstrap.HasExited) { Stop-Process -Id $bootstrap.Id -Force -ErrorAction SilentlyContinue }
              }
              if (-not $tunnel) {
                  $logText = ''
                  if (Test-Path $stderr) { $logText = Get-Content -Raw $stderr }
                  throw "The relay could not create the Wintun adapter. $logText"
              }
              Start-Sleep -Seconds 2
          }

          if (!(Test-Path $networkState)) {
              Write-Host "Configuring Windows forwarding, NAT and UDP 4433 on '$($external.Name)'..."
              & $configureScript -ExternalInterfaceAlias $external.Name -UdpPort 4433
          } else {
              Write-Host 'Existing InfraLap relay network configuration found; keeping it.'
          }

          $taskArgs = '--port 4433 --pfx "' + $pfxPath + '" --pfx-password-file "' + $passwordPath + '" --token-file "' + $tokenPath + '"'
          $action = New-ScheduledTaskAction -Execute $relayExe -Argument $taskArgs -WorkingDirectory $relayRoot
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName
          Start-Sleep -Seconds 3

          $udpListener = Get-NetUDPEndpoint -LocalPort 4433 -ErrorAction SilentlyContinue
          if (-not $udpListener) {
              $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
              throw "Relay task was installed but UDP 4433 is not listening yet. Task result: $($taskInfo.LastTaskResult). Check Windows Event Viewer and the relay logs in $identityDir."
          }

          $nextSteps = @"
          InfraLap MultiWiFi VPS relay setup completed.

          VPS public IPv4: $publicHost
          UDP port: 4433
          Windows firewall: configured by the setup script
          External adapter: $($external.Name)
          Startup: relay is registered to start automatically after Windows restarts

          NEXT:
          1. In your cloud provider firewall/security-group panel, allow inbound UDP 4433.
          2. Securely copy InfraLap-Client-Pairing.json to your laptop.
          3. In InfraLap MultiWiFi, click Import VPS Pairing File and select that JSON file.
          4. The app will save the server address, certificate pin and pairing token securely for this Windows user.

          Keep InfraLap-Client-Pairing.json private. It contains the relay authentication token.
          The PFX, PFX password and pairing token are stored under $identityDir with restricted folder access.
          "@
          [IO.File]::WriteAllText((Join-Path $relayRoot 'SETUP-NEXT-STEPS.txt'), $nextSteps, [Text.Encoding]::UTF8)

          Write-Host ''
          Write-Host 'INFRA LAP VPS RELAY SETUP COMPLETED' -ForegroundColor Green
          Write-Host "VPS address: $publicHost"
          Write-Host 'UDP port: 4433'
          Write-Host 'Relay listener: active'
          Write-Host "Pairing file: $pairingPath"
          Write-Host ''
          Write-Host 'IMPORTANT: Also allow inbound UDP 4433 in your cloud provider firewall/security group.'
          Write-Host 'Copy the pairing JSON securely to your laptop, then use Import VPS Pairing File in the app.'
          Invoke-Item -LiteralPath $identityDir
          '@
          [IO.File]::WriteAllText((Join-Path $relayRoot 'Setup-InfraLapRelay.ps1'), $setup, [Text.UTF8Encoding]::new($false))

          $cmd = @'
          @echo off
          setlocal
          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            powershell.exe -NoProfile -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Setup-InfraLapRelay.ps1"
          if errorlevel 1 (
            echo.
            echo InfraLap relay setup reported an error. Review the message above.
            pause
          )
          '@
          [IO.File]::WriteAllText((Join-Path $relayRoot 'START-INFraLap-Relay-Setup.cmd'), $cmd, [Text.UTF8Encoding]::new($false))
          Write-Host 'Added the one-click VPS relay installer and automatic startup registration.'
      - name: Compile branded Windows installer
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          & $env:ISCC_PATH (Join-Path $projectRoot 'installer/InfraLap-MultiWiFi-v2.iss')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = Join-Path $projectRoot 'installer-output/InfraLap-MultiWiFi-Setup-v2.0.0-dev-x64.exe'
          if (!(Test-Path $setup) -or (Get-Item $setup).Length -lt 10MB) { throw 'The v2 installer is missing or unexpectedly small.' }

      - name: Assemble relay package and checksums
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          $release = Join-Path $projectRoot 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item (Join-Path $projectRoot 'scripts') (Join-Path $projectRoot 'publish/relay/scripts') -Recurse -Force
          Copy-Item (Join-Path $projectRoot 'README.md') (Join-Path $projectRoot 'publish/relay/README-RELAY-SETUP.md') -Force
          Compress-Archive -Path (Join-Path $projectRoot 'publish/relay/*') -DestinationPath (Join-Path $release 'InfraLap-MultiWiFi-Windows-Relay-v2.0.0-dev-x64.zip') -Force
          $sourceStage = Join-Path $env:RUNNER_TEMP 'InfraLap-MultiWiFi-v2-source-release'
          New-Item -ItemType Directory -Force -Path $sourceStage | Out-Null
          foreach ($folder in @('Client','Relay','Shared','scripts','tests','installer','docs','.github')) {
            Copy-Item (Join-Path $projectRoot $folder) $sourceStage -Recurse -Force
          }
          Copy-Item (Join-Path $projectRoot 'InfraLap.MultiWiFi-v2.sln') $sourceStage -Force
          Copy-Item (Join-Path $projectRoot 'README.md') $sourceStage -Force
          Compress-Archive -Path (Join-Path $sourceStage '*') -DestinationPath (Join-Path $release 'InfraLap-MultiWiFi-v2.0.0-dev-source.zip') -Force
          Copy-Item (Join-Path $projectRoot 'installer-output/InfraLap-MultiWiFi-Setup-v2.0.0-dev-x64.exe') $release -Force
          Get-ChildItem $release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content (Join-Path $release 'SHA256SUMS.txt')

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfraLap-MultiWiFi-v2.0.0-dev-x64
          path: MultiWiFi/v2-source/InfraLap-MultiWiFi-v2/release/*
          if-no-files-found: error
          retention-days: 30
