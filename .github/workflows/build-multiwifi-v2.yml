name: InfraLap MultiWiFi v2 Windows Bonding Development Build

on:
  workflow_dispatch:
  push:
    branches:
      - multiwifi-v2-bonding
    paths:
      - 'MultiWiFi/v2-source.parts/**'
      - 'MultiWiFi/docs/**'
      - '.github/workflows/build-multiwifi-v2.yml'

permissions:
  contents: read

concurrency:
  group: multiwifi-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  RUNTIME: win-x64

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4

      - name: Reassemble and verify v2 source archive
        shell: pwsh
        run: |
          $partsDir = Join-Path $env:GITHUB_WORKSPACE 'MultiWiFi/v2-source.parts'
          $parts = @(Get-ChildItem -Path $partsDir -Filter 'source.v2zip.chunk*.b64' -File | Sort-Object Name)
          if ($parts.Count -lt 1) { throw 'No v2 source archive chunks found.' }
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            $chunk = (Get-Content -Raw -Path $part.FullName).Trim()
            if ($chunk -notmatch '^[A-Za-z0-9+/]+=*$') { throw "Invalid base64 characters in $($part.Name)" }
            [void]$builder.Append($chunk)
          }
          $encoded = $builder.ToString()
          if (($encoded.Length % 4) -ne 0) { throw "Joined base64 length is not divisible by four: $($encoded.Length)" }
          $archive = Join-Path $env:RUNNER_TEMP 'InfraLap-MultiWiFi-v2-source.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $expected = (Get-Content (Join-Path $partsDir 'source.sha256') -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "V2 source archive SHA-256 mismatch. Expected $expected, got $actual" }
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'MultiWiFi/v2-source'
          if (Test-Path $sourceRoot) { Remove-Item $sourceRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $sourceRoot -Force
          $projectRoot = Join-Path $sourceRoot 'InfraLap-MultiWiFi-v2'
          if (!(Test-Path (Join-Path $projectRoot 'InfraLap.MultiWiFi-v2.sln'))) { throw 'Extracted v2 solution was not found at the expected path.' }
          "V2_SOURCE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
          "V2_PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Reassembled and verified $($parts.Count) source chunks."

      - name: Inspect QUIC path binding, route scripts and relay implementation
        shell: pwsh
        run: |
          $root = $env:V2_PROJECT_ROOT
          Write-Host '=== SOURCE FILE INVENTORY ==='
          Get-ChildItem -Path $root -Recurse -File |
            Where-Object { $_.Extension -in @('.cs','.ps1','.xaml') } |
            Select-Object -ExpandProperty FullName
          $patterns = @('QuicPathLink.cs','PathDefinition.cs','WeightedPathScheduler.cs','PacketReplayWindow.cs','WintunMultipathBridge.cs','MultipathClient.cs','MultipathPeer.cs')
          foreach ($name in $patterns) {
            $files = @(Get-ChildItem -Path $root -Recurse -File -Filter $name)
            foreach ($file in $files) {
              Write-Host ("=== FILE: " + $file.FullName + " ===")
              Get-Content -Raw -Path $file.FullName
            }
          }
          Write-Host '=== ROUTE SCRIPTS ==='
          $scripts = @(Get-ChildItem -Path (Join-Path $root 'scripts') -Recurse -File -Filter '*.ps1')
          foreach ($file in $scripts) {
            Write-Host ("=== SCRIPT: " + $file.Name + " ===")
            Get-Content -Raw -Path $file.FullName
          }
          Write-Host '=== RELAY CSHARP SOURCES ==='
          $relay = @(Get-ChildItem -Path (Join-Path $root 'Relay') -Recurse -File -Filter '*.cs')
          foreach ($file in $relay) {
            Write-Host ("=== RELAY FILE: " + $file.FullName + " ===")
            Get-Content -Raw -Path $file.FullName
          }

      - name: Inspect Wi-Fi UI and profile management wiring
        shell: pwsh
        run: |
          $root = $env:V2_PROJECT_ROOT
          $targets = @(
            'Client/src/InfraLap.MultiWiFi.App/MainWindow.xaml',
            'Client/src/InfraLap.MultiWiFi.App/MainWindow.xaml.cs',
            'Client/src/InfraLap.MultiWiFi.App/BondingWindow.xaml',
            'Client/src/InfraLap.MultiWiFi.App/Models/WifiInterface.cs',
            'Client/src/InfraLap.MultiWiFi.App/Models/WifiNetwork.cs',
            'Client/src/InfraLap.MultiWiFi.App/InfraLap.MultiWiFi.App.csproj'
          )
          foreach ($relative in $targets) {
            $file = Join-Path $root $relative
            if (Test-Path $file) {
              Write-Host ("=== UI SOURCE: " + $relative + " ===")
              Get-Content -Raw -Path $file
            }
          }
      - name: Inspect relay session registration and selected adapter models
        shell: pwsh
        run: |
          $root = $env:V2_PROJECT_ROOT
          $targets = @(
            'Client/src/InfraLap.MultiWiFi.App/BondingWindow.xaml.cs',
            'Client/src/InfraLap.MultiWiFi.App/Models/PathChoice.cs',
            'Client/src/InfraLap.MultiWiFi.App/Services/NativeWifiService.cs',
            'Client/src/InfraLap.MultiWiFi.App/Services/DualStaService.cs',
            'Shared/InfraLap.MultiWiFi.Bonding/WintunPacketDevice.cs',
            'tests/InfraLap.MultiWiFi.Bonding.Smoke/Program.cs'
          )
          foreach ($relative in $targets) {
            $file = Join-Path $root $relative
            if (Test-Path $file) {
              Write-Host ("=== SOURCE: " + $relative + " ===")
              Get-Content -Raw -Path $file
            }
          }
          Write-Host '=== FILES CONTAINING RELAY HOST / REGISTRATION TYPES ==='
          Get-ChildItem -Path $root -Recurse -File -Filter '*.cs' | ForEach-Object {
            $content = Get-Content -Raw -Path $_.FullName
            if ($content -match 'MultipathRelayHost|PeerCreated|PathHelloAck|AddPath\(') {
              Write-Host ("=== MATCH: " + $_.FullName + " ===")
              Write-Host $content
            }
          }

      - name: Patch QUIC binding verification and route diagnostics
        shell: pwsh
        run: |
          $root = $env:V2_PROJECT_ROOT
          $nl = [Environment]::NewLine

          # QUIC local endpoint verification: never mark a path healthy unless
          # MsQuic reports the adapter source address selected by the UI.
          $quicPath = Join-Path $root 'Shared/InfraLap.MultiWiFi.Bonding/QuicPathLink.cs'
          $quic = [IO.File]::ReadAllText($quicPath)
          $endpointMarker = 'public IPAddress? LocalAddress { get; }'
          if (-not $quic.Contains('public EndPoint? BoundLocalEndPoint => _connection.LocalEndPoint;')) {
            if (-not $quic.Contains($endpointMarker)) { throw 'QuicPathLink endpoint property insertion point not found.' }
            $quic = $quic.Replace($endpointMarker, $endpointMarker + $nl +
              '    public EndPoint? BoundLocalEndPoint => _connection.LocalEndPoint;' + $nl +
              '    public EndPoint? RelayRemoteEndPoint => _connection.RemoteEndPoint;')
          }
          $streamMarker = 'var stream = await connection.OpenOutboundStreamAsync(QuicStreamType.Bidirectional, cancellationToken).ConfigureAwait(false);'
          if (-not $quic.Contains('var actualLocal = connection.LocalEndPoint as IPEndPoint;')) {
            if (-not $quic.Contains($streamMarker)) { throw 'QuicPathLink stream insertion point not found.' }
            $bindingCheck = @'
          var actualLocal = connection.LocalEndPoint as IPEndPoint;
          if (actualLocal is null || !actualLocal.Address.Equals(path.LocalAddress))
              throw new System.IO.IOException($"QUIC path '{path.Name}' requested local address {path.LocalAddress}, but the connected socket reports {connection.LocalEndPoint}.");
          '@
            $quic = $quic.Replace($streamMarker, $bindingCheck + $nl + '            ' + $streamMarker)
          }
          [IO.File]::WriteAllText($quicPath, $quic, [Text.UTF8Encoding]::new($false))

          # Display the real local/remote endpoints returned by the QUIC connection,
          # rather than only echoing the IP address that was requested.
          $peerPath = Join-Path $root 'Shared/InfraLap.MultiWiFi.Bonding/MultipathPeer.cs'
          $peer = [IO.File]::ReadAllText($peerPath)
          $oldStatus = 'x.BytesSent, x.BytesReceived, x.IsConnected ? "Connected" : "Disconnected")).ToArray();'
          $newStatus = 'x.BytesSent, x.BytesReceived, x.IsConnected ? $"Connected · bound {x.BoundLocalEndPoint} · relay {x.RelayRemoteEndPoint}" : "Disconnected")).ToArray();'
          if (-not $peer.Contains($newStatus)) {
            if (-not $peer.Contains($oldStatus)) { throw 'MultipathPeer status insertion point not found.' }
            $peer = $peer.Replace($oldStatus, $newStatus)
          }
          [IO.File]::WriteAllText($peerPath, $peer, [Text.UTF8Encoding]::new($false))

          $windowPath = Join-Path $root 'Client/src/InfraLap.MultiWiFi.App/BondingWindow.xaml.cs'
          $window = [IO.File]::ReadAllText($windowPath)
          $oldRender = 'status.Text = path.Connected ? $"Connected · {path.LocalAddress}" : "Disconnected";'
          if (-not $window.Contains('status.Text = path.State;')) {
            if (-not $window.Contains($oldRender)) { throw 'BondingWindow path status insertion point not found.' }
            $window = $window.Replace($oldRender, 'status.Text = path.State;')
          }
          $oldBanner = 'BondingStatus.Text = "BONDED TUNNEL ACTIVE · IPv4 traffic is routed through InfraLap. Test with one ordinary download and verify both paths receive traffic.";'
          $newBanner = 'BondingStatus.Text = "Two QUIC paths established. Per-path tunnel traffic is being measured; bonding is not verified until both paths carry payload during one download.";'
          if (-not $window.Contains($newBanner)) {
            if (-not $window.Contains($oldBanner)) { throw 'BondingWindow status banner insertion point not found.' }
            $window = $window.Replace($oldBanner, $newBanner)
          }
          [IO.File]::WriteAllText($windowPath, $window, [Text.UTF8Encoding]::new($false))

          # Verify Windows selects the expected physical interface for the relay
          # when the source address is constrained to each adapter.
          $routePath = Join-Path $root 'scripts/Connect-InfraLapClient.ps1'
          $route = [IO.File]::ReadAllText($routePath)
          $routePattern = '(\$state\.CreatedRelayRoutes \+= [^\r\n]+\r?\n[ \t]*Save-State\r?\n[ \t]*\})\r?\n([ \t]*\})\r?\n([ \t]*\$existingTunnelAddress =)'
          if (-not $route.Contains('Find-NetRoute -RemoteIPAddress $RelayIPv4 -LocalIPAddress $localAddress')) {
            $match = [regex]::Match($route, $routePattern)
            if (-not $match.Success) { throw 'Client route verification insertion point not found.' }
            $routeCheck = @'
          $localAddress = $ipConfig.IPv4Address |
              Where-Object { $_.IPAddress -and $_.IPAddress -notlike '169.254.*' } |
              Select-Object -First 1 -ExpandProperty IPAddress
          if (-not $localAddress) { throw "No usable IPv4 source address found on '$alias'." }

          $selectedRoute = @(Find-NetRoute -RemoteIPAddress $RelayIPv4 -LocalIPAddress $localAddress -ErrorAction Stop)
          $selectedInterface = @($selectedRoute | Where-Object {
              $_.PSObject.Properties['InterfaceIndex'] -and [int]$_.InterfaceIndex -eq [int]$physical.ifIndex
          } | Select-Object -First 1)
          if ($selectedInterface.Count -eq 0) {
              $routeDetails = ($selectedRoute | Format-List * | Out-String).Trim()
              throw "Windows did not select '$alias' (ifIndex $($physical.ifIndex)) for relay $RelayIPv4 from source $localAddress. Route result: $routeDetails"
          }
          Write-Host "Verified relay route: adapter='$alias' ifIndex=$($physical.ifIndex) source=$localAddress gateway=$gateway relay=$RelayIPv4"
          '@
            $tailIndex = $match.Index + $match.Length
            $route = $route.Substring(0, $match.Index) +
              $match.Groups[1].Value + $nl + $routeCheck + $nl +
              $match.Groups[2].Value + $nl + $match.Groups[3].Value +
              $route.Substring($tailIndex)
            [IO.File]::WriteAllText($routePath, $route, [Text.UTF8Encoding]::new($false))
          }
          Write-Host 'QUIC endpoint and per-adapter relay route diagnostics patched.'
      - name: Implement adapter Wi-Fi manager and safe reconnect recovery
        shell: pwsh
        run: |
          $root = $env:V2_PROJECT_ROOT
          $app = Join-Path $root 'Client/src/InfraLap.MultiWiFi.App'
          $bondingPath = Join-Path $app 'BondingWindow.xaml.cs'
          $bonding = [IO.File]::ReadAllText($bondingPath)

          if (-not $bonding.Contains('AddWifiManagerLauncher();')) {
            $ctorMarker = '        InitializeComponent();'
            if (-not $bonding.Contains($ctorMarker)) { throw 'BondingWindow constructor marker not found.' }
            $bonding = $bonding.Replace($ctorMarker, $ctorMarker + [Environment]::NewLine + '        AddWifiManagerLauncher();')
          }
          if (-not $bonding.Contains('private void AddWifiManagerLauncher()')) {
            $method = @'
          private void AddWifiManagerLauncher()
          {
              if (Content is not System.Windows.UIElement originalContent) return;
              Content = null;
              var shell = new System.Windows.Controls.DockPanel();
              var toolbar = new System.Windows.Controls.Border
              {
                  Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(15, 23, 42)),
                  Padding = new Thickness(12, 8, 12, 8)
              };
              var bar = new System.Windows.Controls.DockPanel();
              var hint = new System.Windows.Controls.TextBlock
              {
                  Text = "Manage Wi-Fi adapters, saved passwords and reconnection",
                  Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(203, 213, 225)),
                  VerticalAlignment = VerticalAlignment.Center,
                  Margin = new Thickness(4, 0, 16, 0)
              };
              var button = new System.Windows.Controls.Button
              {
                  Content = "Wi-Fi & Password Manager",
                  Padding = new Thickness(16, 8, 16, 8),
                  FontWeight = FontWeights.SemiBold,
                  Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(37, 99, 235)),
                  Foreground = System.Windows.Media.Brushes.White,
                  BorderThickness = new Thickness(0),
                  Cursor = System.Windows.Input.Cursors.Hand
              };
              button.Click += async (_, _) =>
              {
                  if (_client is not null)
                      await StopBondingAsync(showStatus: true);
                  var manager = new WifiManagerWindow { Owner = this };
                  manager.ShowDialog();
                  RefreshPaths();
              };
              System.Windows.Controls.DockPanel.SetDock(button, System.Windows.Controls.Dock.Right);
              bar.Children.Add(button);
              bar.Children.Add(hint);
              toolbar.Child = bar;
              System.Windows.Controls.DockPanel.SetDock(toolbar, System.Windows.Controls.Dock.Top);
              shell.Children.Add(toolbar);
              shell.Children.Add(originalContent);
              Content = shell;
          }

          '@
            $insertAt = '    private void RefreshPaths_Click(object sender, RoutedEventArgs e) => RefreshPaths();'
            if (-not $bonding.Contains($insertAt)) { throw 'BondingWindow method insertion point not found.' }
            $bonding = $bonding.Replace($insertAt, $method + $insertAt)
          }

          $oldCleanup = @'
              if (_activeAliases.Length > 0)
              {
                  var script = Path.Combine(AppContext.BaseDirectory, "scripts", "Disconnect-InfraLapClient.ps1");
                  await RunPowerShellAsync(script, new[] { "-AdapterAliases", string.Join(",", _activeAliases) });
              }
          '@
          $newCleanup = @'
              var script = Path.Combine(AppContext.BaseDirectory, "scripts", "Disconnect-InfraLapClient.ps1");
              if (File.Exists(script))
                  await RunPowerShellAsync(script, Array.Empty<string>());
          '@
          if (-not $bonding.Contains('await RunPowerShellAsync(script, Array.Empty<string>());')) {
            $cleanupPattern = '(?ms)^[ 	]*if\s*\(_activeAliases\.Length\s*>\s*0\)\s*\{\s*var\s+script\s*=\s*Path\.Combine\(AppContext\.BaseDirectory,\s*"scripts",\s*"Disconnect-InfraLapClient\.ps1"\);\s*await\s+RunPowerShellAsync\(script,\s*new\[\]\s*\{\s*"-AdapterAliases",\s*string\.Join\(",",\s*_activeAliases\)\s*\}\);\s*\}'
            if (-not [regex]::IsMatch($bonding, $cleanupPattern)) { throw 'StopBondingAsync cleanup block not found (regex recovery check).' }
            $bonding = [regex]::Replace($bonding, $cleanupPattern, $newCleanup.Trim(), 1)
          }
          $stopTail = '        if (showStatus) BondingStatus.Text = "Bonding stopped. InfraLap tunnel routes were removed; your original Wi-Fi routes remain.";'
          if ($bonding.Contains($stopTail) -and -not $bonding.Contains($stopTail + [Environment]::NewLine + '        RefreshPaths();')) {
            $bonding = $bonding.Replace($stopTail, '        RefreshPaths();' + [Environment]::NewLine + $stopTail)
          }
          [IO.File]::WriteAllText($bondingPath, $bonding, [Text.UTF8Encoding]::new($false))

          $wifiManager = @'
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using System.Threading.Tasks;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Media;
          using InfraLap.MultiWiFi.Models;
          using InfraLap.MultiWiFi.Services;

          namespace InfraLap.MultiWiFi;

          public sealed class WifiManagerWindow : Window
          {
              private readonly NativeWifiService _wifi = new();
              private readonly WrapPanel _cards = new();
              private readonly TextBlock _status = new();
              private bool _scanning;

              public WifiManagerWindow()
              {
                  Title = "InfraLap MultiWiFi — Adapter & Password Manager";
                  Width = 980;
                  Height = 720;
                  MinWidth = 760;
                  MinHeight = 560;
                  WindowStartupLocation = WindowStartupLocation.CenterOwner;
                  Background = new SolidColorBrush(Color.FromRgb(10, 16, 29));
                  BuildLayout();
                  Loaded += async (_, _) => await RefreshAsync();
              }

              private void BuildLayout()
              {
                  var root = new DockPanel { LastChildFill = true, Margin = new Thickness(18) };
                  var header = new StackPanel { Margin = new Thickness(4, 4, 4, 14) };
                  header.Children.Add(new TextBlock
                  {
                      Text = "Wi-Fi Adapter Manager",
                      FontSize = 25,
                      FontWeight = FontWeights.Bold,
                      Foreground = Brushes.White
                  });
                  header.Children.Add(new TextBlock
                  {
                      Text = "Configure each physical adapter independently. Passwords are saved in Windows Wi-Fi profiles, not stored by InfraLap.",
                      TextWrapping = TextWrapping.Wrap,
                      Foreground = new SolidColorBrush(Color.FromRgb(165, 180, 205)),
                      Margin = new Thickness(0, 6, 0, 10)
                  });
                  var refresh = MakeButton("Scan / Refresh Networks", Color.FromRgb(37, 99, 235));
                  refresh.Click += async (_, _) => await RefreshAsync();
                  header.Children.Add(refresh);
                  DockPanel.SetDock(header, Dock.Top);
                  root.Children.Add(header);

                  var footer = new Border
                  {
                      Background = new SolidColorBrush(Color.FromRgb(18, 28, 46)),
                      CornerRadius = new CornerRadius(10),
                      Padding = new Thickness(12),
                      Margin = new Thickness(0, 12, 0, 0),
                      Child = _status
                  };
                  _status.Foreground = Brushes.White;
                  _status.Text = "Ready.";
                  _status.TextWrapping = TextWrapping.Wrap;
                  DockPanel.SetDock(footer, Dock.Bottom);
                  root.Children.Add(footer);

                  var scroll = new ScrollViewer { VerticalScrollBarVisibility = ScrollBarVisibility.Auto };
                  scroll.Content = _cards;
                  root.Children.Add(scroll);
                  Content = root;
              }

              private async Task RefreshAsync()
              {
                  if (_scanning) return;
                  _scanning = true;
                  _status.Text = "Scanning each Wi-Fi adapter. This can take several seconds...";
                  try
                  {
                      var result = await Task.Run(() => _wifi.Scan());
                      _cards.Children.Clear();
                      var index = 0;
                      foreach (var adapter in result.Interfaces)
                      {
                          var networks = result.Networks
                              .Where(n => n.InterfaceGuid == adapter.InterfaceGuid)
                              .OrderByDescending(n => n.SignalQuality)
                              .ToList();
                          _cards.Children.Add(BuildAdapterCard(adapter, networks, ++index));
                      }
                      if (index == 0)
                          _status.Text = "No Wi-Fi interfaces were found. Check that both Wi-Fi adapters are enabled in Windows.";
                      else
                          _status.Text = $"Found {index} Wi-Fi adapter(s) and {result.Networks.Count} visible network entries. Choose a network on the adapter you want to configure.";
                  }
                  catch (Exception ex)
                  {
                      _status.Text = "Wi-Fi scan failed: " + ex.Message;
                  }
                  finally { _scanning = false; }
              }

              private Border BuildAdapterCard(WifiInterface adapter, List<WifiNetwork> networks, int number)
              {
                  var panel = new StackPanel();
                  panel.Children.Add(new TextBlock
                  {
                      Text = $"ADAPTER {number}",
                      FontSize = 12,
                      FontWeight = FontWeights.Bold,
                      Foreground = new SolidColorBrush(Color.FromRgb(96, 165, 250))
                  });
                  panel.Children.Add(new TextBlock
                  {
                      Text = adapter.Description,
                      FontSize = 17,
                      FontWeight = FontWeights.SemiBold,
                      Foreground = Brushes.White,
                      TextWrapping = TextWrapping.Wrap,
                      Margin = new Thickness(0, 4, 0, 2)
                  });
                  string connectedSsid = string.Empty;
                  try { connectedSsid = _wifi.GetConnectedSsid(adapter.InterfaceGuid); } catch { }
                  panel.Children.Add(new TextBlock
                  {
                      Text = $"Windows status: {adapter.State}" + (string.IsNullOrWhiteSpace(connectedSsid) ? "" : $" · Connected to {connectedSsid}"),
                      Foreground = new SolidColorBrush(Color.FromRgb(148, 163, 184)),
                      TextWrapping = TextWrapping.Wrap,
                      Margin = new Thickness(0, 0, 0, 12)
                  });

                  var networkPicker = new ComboBox
                  {
                      ItemsSource = networks,
                      DisplayMemberPath = "Ssid",
                      MinHeight = 34,
                      Margin = new Thickness(0, 0, 0, 8)
                  };
                  if (networks.Count > 0)
                  {
                      var current = networks.FirstOrDefault(n => n.Ssid == connectedSsid);
                      networkPicker.SelectedItem = current ?? networks[0];
                  }
                  panel.Children.Add(FieldLabel("Available Wi-Fi networks"));
                  panel.Children.Add(networkPicker);

                  var details = new TextBlock
                  {
                      Foreground = new SolidColorBrush(Color.FromRgb(148, 163, 184)),
                      TextWrapping = TextWrapping.Wrap,
                      Margin = new Thickness(0, 0, 0, 10)
                  };
                  void UpdateDetails()
                  {
                      if (networkPicker.SelectedItem is WifiNetwork n)
                      {
                          var saved = string.IsNullOrWhiteSpace(n.ProfileName) ? "No saved profile" : "Saved profile: " + n.ProfileName;
                          details.Text = $"{n.Ssid} · Signal {n.SignalQuality}% · {n.Authentication} · {saved}";
                      }
                      else details.Text = "No visible network selected.";
                  }
                  networkPicker.SelectionChanged += (_, _) => UpdateDetails();
                  UpdateDetails();
                  panel.Children.Add(details);

                  panel.Children.Add(FieldLabel("New or updated Wi-Fi password"));
                  var password = new PasswordBox { MinHeight = 34, Margin = new Thickness(0, 0, 0, 8) };
                  panel.Children.Add(password);
                  var autoConnect = new CheckBox
                  {
                      Content = "Connect automatically",
                      IsChecked = true,
                      Foreground = new SolidColorBrush(Color.FromRgb(203, 213, 225)),
                      Margin = new Thickness(0, 0, 0, 10)
                  };
                  panel.Children.Add(autoConnect);

                  var connectSaved = MakeButton("Connect Using Saved Password", Color.FromRgb(51, 65, 85));
                  connectSaved.Margin = new Thickness(0, 3, 0, 3);
                  connectSaved.Click += async (_, _) =>
                  {
                      if (networkPicker.SelectedItem is not WifiNetwork selected) { _status.Text = "Select a network first."; return; }
                      if (string.IsNullOrWhiteSpace(selected.ProfileName)) { _status.Text = "No saved password/profile for this network. Enter the password and choose Save & Connect."; return; }
                      await RunCardActionAsync(async () =>
                      {
                          _status.Text = $"Connecting {adapter.Description} to {selected.Ssid}...";
                          _status.Text = await _wifi.ConnectAndVerifyAsync(adapter.InterfaceGuid, selected.ProfileName, selected.Ssid);
                      });
                  };
                  panel.Children.Add(connectSaved);

                  var saveConnect = MakeButton("Save / Update Password & Connect", Color.FromRgb(22, 163, 74));
                  saveConnect.Margin = new Thickness(0, 3, 0, 3);
                  saveConnect.Click += async (_, _) =>
                  {
                      if (networkPicker.SelectedItem is not WifiNetwork selected) { _status.Text = "Select a network first."; return; }
                      await RunCardActionAsync(async () =>
                      {
                          var newPassword = password.Password;
                          var shouldConnectAutomatically = autoConnect.IsChecked == true;
                          var profile = await Task.Run(() => _wifi.SaveOrUpdateProfile(adapter.InterfaceGuid, selected, newPassword, shouldConnectAutomatically));
                          _status.Text = $"Saved Windows Wi-Fi profile '{profile}'. Reconnecting...";
                          _status.Text = await _wifi.ConnectAndVerifyAsync(adapter.InterfaceGuid, profile, selected.Ssid);
                          password.Clear();
                      });
                  };
                  panel.Children.Add(saveConnect);

                  var row = new WrapPanel { Margin = new Thickness(0, 4, 0, 0) };
                  var disconnect = MakeButton("Disconnect", Color.FromRgb(185, 28, 28));
                  disconnect.Margin = new Thickness(0, 3, 6, 3);
                  disconnect.Click += async (_, _) =>
                  {
                      await RunCardActionAsync(async () =>
                      {
                          _status.Text = _wifi.Disconnect(adapter.InterfaceGuid);
                          await Task.Delay(500);
                      });
                  };
                  row.Children.Add(disconnect);

                  var forget = MakeButton("Forget Saved Profile", Color.FromRgb(71, 85, 105));
                  forget.Margin = new Thickness(0, 3, 0, 3);
                  forget.Click += async (_, _) =>
                  {
                      if (networkPicker.SelectedItem is not WifiNetwork selected) { _status.Text = "Select a network first."; return; }
                      if (string.IsNullOrWhiteSpace(selected.ProfileName)) { _status.Text = "This network has no saved profile to forget."; return; }
                      var answer = MessageBox.Show(this, $"Forget the saved profile '{selected.ProfileName}' on {adapter.Description}?", "Confirm", MessageBoxButton.YesNo, MessageBoxImage.Question);
                      if (answer != MessageBoxResult.Yes) return;
                      await RunCardActionAsync(async () =>
                      {
                          _status.Text = _wifi.ForgetProfile(adapter.InterfaceGuid, selected.ProfileName);
                          await Task.Delay(300);
                          await RefreshAsync();
                      });
                  };
                  row.Children.Add(forget);
                  panel.Children.Add(row);

                  return new Border
                  {
                      Width = 430,
                      Margin = new Thickness(8),
                      Padding = new Thickness(18),
                      CornerRadius = new CornerRadius(16),
                      BorderThickness = new Thickness(1),
                      BorderBrush = new SolidColorBrush(Color.FromRgb(43, 57, 78)),
                      Background = new SolidColorBrush(Color.FromRgb(17, 27, 45)),
                      Child = panel
                  };
              }

              private async Task RunCardActionAsync(Func<Task> action)
              {
                  try { await action(); }
                  catch (Exception ex) { _status.Text = "Wi-Fi operation failed: " + ex.Message; }
              }

              private static TextBlock FieldLabel(string text) => new()
              {
                  Text = text,
                  Foreground = new SolidColorBrush(Color.FromRgb(203, 213, 225)),
                  FontWeight = FontWeights.SemiBold,
                  Margin = new Thickness(0, 5, 0, 4)
              };

              private static Button MakeButton(string text, Color color) => new()
              {
                  Content = text,
                  Padding = new Thickness(12, 8, 12, 8),
                  MinHeight = 34,
                  Background = new SolidColorBrush(color),
                  Foreground = Brushes.White,
                  BorderThickness = new Thickness(0),
                  FontWeight = FontWeights.SemiBold,
                  Cursor = System.Windows.Input.Cursors.Hand
              };
          }
          '@
          $wifiPath = Join-Path $app 'WifiManagerWindow.cs'
          [IO.File]::WriteAllText($wifiPath, $wifiManager, [Text.UTF8Encoding]::new($false))

          $connectPath = Join-Path $root 'scripts/Connect-InfraLapClient.ps1'
          $connect = [IO.File]::ReadAllText($connectPath)
          $oldGuard = @'
          if (Test-Path $statePath) { throw 'An InfraLap tunnel network state already exists. Stop/restore the previous tunnel before connecting again.' }
          '@
          $newGuard = @'
          if (Test-Path $statePath) {
              Write-Warning 'A previous InfraLap network state was found. Attempting safe recovery before reconnecting.'
              $recoveryScript = Join-Path $PSScriptRoot 'Disconnect-InfraLapClient.ps1'
              if (-not (Test-Path $recoveryScript)) { throw "Recovery script is missing: $recoveryScript" }
              & $recoveryScript -TunnelAlias $TunnelAlias -TunnelAddress $TunnelAddress -RelayTunnelAddress $RelayTunnelAddress
              if (Test-Path $statePath) { throw "Previous InfraLap network state could not be cleared. Review $statePath before retrying." }
          }
          '@
          if (-not $connect.Contains('Attempting safe recovery before reconnecting.')) {
              if (-not $connect.Contains($oldGuard.Trim())) { throw 'Existing stale-state guard not found in Connect-InfraLapClient.ps1.' }
              $connect = $connect.Replace($oldGuard.Trim(), $newGuard.TrimEnd())
              [IO.File]::WriteAllText($connectPath, $connect, [Text.UTF8Encoding]::new($false))
          }
          Write-Host 'Wi-Fi manager and reconnect recovery code staged.'
      - name: Apply System.IO compile fix and stage patched source
        shell: pwsh
        run: |
          $codePath = Join-Path $env:V2_PROJECT_ROOT 'Client/src/InfraLap.MultiWiFi.App/BondingWindow.xaml.cs'
          $code = [IO.File]::ReadAllText($codePath)
          if ($code -notmatch '(?m)^using System\.IO;') {
            [IO.File]::WriteAllText($codePath, "using System.IO;`r`n" + $code, [Text.UTF8Encoding]::new($false))
          }
          $issPath = Join-Path $env:V2_PROJECT_ROOT 'installer/InfraLap-MultiWiFi-v2.iss'
          $iss = [IO.File]::ReadAllText($issPath)
          $iss = $iss.Replace('; Flags: checked', '')
          [IO.File]::WriteAllText($issPath, $iss, [Text.UTF8Encoding]::new($false))

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download and verify official Wintun x64 package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ($actual -ne $expected) { throw "Wintun archive SHA-256 mismatch. Expected $expected, got $actual" }
          $root = Join-Path $env:RUNNER_TEMP 'wintun-package'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $dll = Get-ChildItem -Path $root -Filter 'wintun.dll' -File -Recurse | Where-Object { $_.FullName -match '\\(amd64|x64)\\wintun\.dll$' } | Select-Object -First 1
          if (!$dll) { throw 'Official Wintun archive did not contain an AMD64 wintun.dll.' }
          $license = Get-ChildItem -Path $root -File -Recurse | Where-Object { $_.Name -match '^(COPYING|LICENSE)(\.txt)?$' } | Select-Object -First 1
          if (!$license) { throw 'Wintun license file not found in official archive.' }
          "WINTUN_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINTUN_LICENSE=$($license.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore solution
        shell: pwsh
        run: dotnet restore (Join-Path $env:V2_PROJECT_ROOT 'InfraLap.MultiWiFi-v2.sln')

      - name: Build solution
        shell: pwsh
        run: dotnet build (Join-Path $env:V2_PROJECT_ROOT 'InfraLap.MultiWiFi-v2.sln') -c $env:CONFIGURATION --no-restore -p:Platform=x64

      - name: Run bonding logic smoke tests
        shell: pwsh
        run: dotnet run --project (Join-Path $env:V2_PROJECT_ROOT 'tests/InfraLap.MultiWiFi.Bonding.Smoke/InfraLap.MultiWiFi.Bonding.Smoke.csproj') -c $env:CONFIGURATION

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @("${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe", "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler was not found.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Windows x64 client and relay
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          $publishRoot = Join-Path $projectRoot 'publish'
          $appOut = Join-Path $publishRoot 'app'
          $relayOut = Join-Path $publishRoot 'relay'
          New-Item -ItemType Directory -Force -Path $appOut,$relayOut | Out-Null
          dotnet publish (Join-Path $projectRoot 'Client/src/InfraLap.MultiWiFi.App/InfraLap.MultiWiFi.App.csproj') -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Platform=x64 -o $appOut
          if ($LASTEXITCODE -ne 0) { throw "Client publish failed: $LASTEXITCODE" }
          dotnet publish (Join-Path $projectRoot 'Relay/InfraLap.MultiWiFi.Relay.csproj') -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Platform=x64 -o $relayOut
          if ($LASTEXITCODE -ne 0) { throw "Relay publish failed: $LASTEXITCODE" }
          Copy-Item $env:WINTUN_DLL -Destination (Join-Path $appOut 'wintun.dll') -Force
          Copy-Item $env:WINTUN_DLL -Destination (Join-Path $relayOut 'wintun.dll') -Force
          Copy-Item $env:WINTUN_LICENSE -Destination (Join-Path $appOut 'WINTUN-LICENSE.txt') -Force
          Copy-Item $env:WINTUN_LICENSE -Destination (Join-Path $relayOut 'WINTUN-LICENSE.txt') -Force
          $required = @((Join-Path $appOut 'InfraLap.MultiWiFi.exe'),(Join-Path $relayOut 'InfraLap.MultiWiFi.Relay.exe'),(Join-Path $appOut 'wintun.dll'),(Join-Path $relayOut 'wintun.dll'))
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Required package file missing: $file" } }

      - name: Compile branded Windows installer
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          & $env:ISCC_PATH (Join-Path $projectRoot 'installer/InfraLap-MultiWiFi-v2.iss')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = Join-Path $projectRoot 'installer-output/InfraLap-MultiWiFi-Setup-v2.0.0-dev-x64.exe'
          if (!(Test-Path $setup) -or (Get-Item $setup).Length -lt 10MB) { throw 'The v2 installer is missing or unexpectedly small.' }

      - name: Assemble relay package and checksums
        shell: pwsh
        run: |
          $projectRoot = $env:V2_PROJECT_ROOT
          $release = Join-Path $projectRoot 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item (Join-Path $projectRoot 'scripts') (Join-Path $projectRoot 'publish/relay/scripts') -Recurse -Force
          Copy-Item (Join-Path $projectRoot 'README.md') (Join-Path $projectRoot 'publish/relay/README-RELAY-SETUP.md') -Force
          Compress-Archive -Path (Join-Path $projectRoot 'publish/relay/*') -DestinationPath (Join-Path $release 'InfraLap-MultiWiFi-Windows-Relay-v2.0.0-dev-x64.zip') -Force
          $sourceStage = Join-Path $env:RUNNER_TEMP 'InfraLap-MultiWiFi-v2-source-release'
          New-Item -ItemType Directory -Force -Path $sourceStage | Out-Null
          foreach ($folder in @('Client','Relay','Shared','scripts','tests','installer','docs','.github')) {
            Copy-Item (Join-Path $projectRoot $folder) $sourceStage -Recurse -Force
          }
          Copy-Item (Join-Path $projectRoot 'InfraLap.MultiWiFi-v2.sln') $sourceStage -Force
          Copy-Item (Join-Path $projectRoot 'README.md') $sourceStage -Force
          Compress-Archive -Path (Join-Path $sourceStage '*') -DestinationPath (Join-Path $release 'InfraLap-MultiWiFi-v2.0.0-dev-source.zip') -Force
          Copy-Item (Join-Path $projectRoot 'installer-output/InfraLap-MultiWiFi-Setup-v2.0.0-dev-x64.exe') $release -Force
          Get-ChildItem $release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content (Join-Path $release 'SHA256SUMS.txt')

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfraLap-MultiWiFi-v2.0.0-dev-x64
          path: MultiWiFi/v2-source/InfraLap-MultiWiFi-v2/release/*
          if-no-files-found: error
          retention-days: 30
