name: InfraLap MultiWiFi v1.2.1 Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - multiwifi-v1.2.1-build-clean
    paths:
      - '.github/workflows/build-multiwifi-v1.2.1.yml'
      - 'MultiWiFi/InfraLap-MultiWiFi-v1.2.1-source.zip'
      - 'MultiWiFi/InfraLap-MultiWiFi-v1.2.1-build-source.zip.b64'
      - 'MultiWiFi/InfraLap-MultiWiFi-v1.2.1-build-source.part6.b64'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify and extract supplied source ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'MultiWiFi/InfraLap-MultiWiFi-v1.2.1-source.zip'
          $encodedArchive = Join-Path $env:GITHUB_WORKSPACE 'MultiWiFi/InfraLap-MultiWiFi-v1.2.1-build-source.zip.b64'
          if (!(Test-Path $archive) -and (Test-Path $encodedArchive)) {
            $encoded = (Get-Content -Raw -Path $encodedArchive).Trim()
            [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          }
          if (!(Test-Path $archive)) {
            $parts = 1..6 | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ("MultiWiFi/InfraLap-MultiWiFi-v1.2.1-build-source.part{0}.b64" -f $_) }
            if (@($parts | Where-Object { !(Test-Path $_) }).Count -eq 0) {
              $encoded = [string]::Concat(@($parts | ForEach-Object { (Get-Content -Raw -Path $_).Trim() }))
              [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
            }
          }
          if (!(Test-Path $archive)) { throw 'Source ZIP missing. Expected the source ZIP or its .b64 transport file in MultiWiFi/.' }
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'infralap-multiwifi-source'
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $sourceRoot -Force
          $project = Get-ChildItem $sourceRoot -Filter 'InfraLap.MultiWiFi.App.csproj' -Recurse | Select-Object -First 1
          $installer = Get-ChildItem $sourceRoot -Filter 'InfraLap-MultiWiFi.iss' -Recurse | Select-Object -First 1
          if (!$project -or !$installer) { throw 'The ZIP does not contain the WPF project and Inno Setup script.' }
          "PROJECT_FILE=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROJECT_DIR=$($project.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SCRIPT=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler not found.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply compile fixes to source
        shell: pwsh
        run: |
          $viewModel = Join-Path $env:PROJECT_DIR 'ViewModels\MainViewModel.cs'
          $code = Get-Content -Raw -Path $viewModel
          if ($code -notmatch '(?m)^using System\.IO;') {
            $code = $code.Replace('using System.Collections.ObjectModel;', ('using System.Collections.ObjectModel;' + [Environment]::NewLine + 'using System.IO;'))
          }
          $ipv6Pattern = '(?s)\s*try\s*\{\s*var ipv6 = net\.GetIPv6Statistics\(\);.*?catch \(PlatformNotSupportedException\) \{ \}\s*'
          $patched = [regex]::Replace($code, $ipv6Pattern, [Environment]::NewLine, 1)
          if ($patched.Contains('GetIPv6Statistics')) { throw 'IPv6 statistics compile fix did not apply.' }
          Set-Content -Path $viewModel -Value $patched -NoNewline -Encoding utf8
          Write-Host 'Applied .NET-compatible traffic-counter and diagnostics fixes.'
          $installerScript = Join-Path (Split-Path $env:PROJECT_DIR -Parent) '..\\installer\\InfraLap-MultiWiFi.iss'
          $installerScript = [IO.Path]::GetFullPath($installerScript)
          $iss = Get-Content -Raw -Path $installerScript
          $iss = $iss.Replace('; Flags: checked', '')
          Set-Content -Path $installerScript -Value $iss -NoNewline -Encoding utf8
          Write-Host 'Removed unsupported Inno Setup task flag.'

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: |
          $publish = Join-Path $env:PROJECT_DIR 'publish\win-x64'
          dotnet publish $env:PROJECT_FILE -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }
          $appExe = Join-Path $publish 'InfraLap.MultiWiFi.exe'
          if (!(Test-Path $appExe)) { throw 'Published application EXE was not generated.' }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & $env:ISCC_PATH $env:INSTALLER_SCRIPT
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $projectRoot = Split-Path (Split-Path $env:INSTALLER_SCRIPT -Parent) -Parent
          $setup = Join-Path $projectRoot 'installer-output\InfraLap-MultiWiFi-Setup-x64.exe'
          if (!(Test-Path $setup)) { throw 'Expected installer was not generated.' }
          if ((Get-Item $setup).Length -lt 1MB) { throw 'Setup.exe is unexpectedly small.' }
          "SETUP_EXE=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraLap-MultiWiFi-Setup-v1.2.1-x64
          path: ${{ env.SETUP_EXE }}
          if-no-files-found: error
          retention-days: 30
