name: InfraLap MultiWiFi Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - multiwifi-build
    paths:
      - 'MultiWiFi/source.zip'
      - '.github/workflows/build-multiwifi.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'MultiWiFi/source.zip'
          if (!(Test-Path $archive)) {
            throw 'Source archive missing. Upload the complete MultiWiFi source ZIP to MultiWiFi/source.zip on branch multiwifi-build.'
          }
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'infralap-multiwifi-source'
          if (Test-Path $sourceRoot) { Remove-Item $sourceRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $sourceRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $sourceRoot -Force
          $project = Get-ChildItem $sourceRoot -Filter 'InfraLap.MultiWiFi.App.csproj' -Recurse | Select-Object -First 1
          if (!$project) { throw 'InfraLap.MultiWiFi.App.csproj was not found in the source ZIP.' }
          $root = $project.Directory.FullName
          "PROJECT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          $installer = Get-ChildItem $sourceRoot -Filter 'InfraLap-MultiWiFi.iss' -Recurse | Select-Object -First 1
          if (!$installer) { throw 'InfraLap-MultiWiFi.iss was not found in the source ZIP.' }
          "INSTALLER_SCRIPT=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          $project = Get-ChildItem $env:PROJECT_DIR -Filter '*.csproj' | Select-Object -First 1
          if (!$project) { throw 'Application project file not found.' }
          $publish = Join-Path $env:PROJECT_DIR 'publish\win-x64'
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & $env:ISCC_PATH $env:INSTALLER_SCRIPT
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = Get-ChildItem (Split-Path $env:INSTALLER_SCRIPT -Parent) -Filter 'InfraLap-MultiWiFi-Setup-x64.exe' -Recurse | Select-Object -First 1
          if (!$setup) { throw 'Expected Setup.exe was not generated.' }
          "SETUP_EXE=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraLap-MultiWiFi-Setup-x64
          path: ${{ env.SETUP_EXE }}
          if-no-files-found: error
          retention-days: 30
